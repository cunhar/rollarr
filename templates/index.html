<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolarr - Sonarr Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.15);
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
        }
        .container {
            width: 100%;
            max-width: 540px;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #fff 40%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 6px 16px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 12px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: {{ status_color }};
            border-radius: 50%;
            box-shadow: 0 0 12px {{ status_color }};
            animation: pulse 2s infinite;
        }
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .info-group {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            transition: border-color 0.3s ease, background 0.3s ease;
        }
        .info-group:hover {
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(99, 102, 241, 0.02);
        }
        .label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .value {
            font-size: 15px;
            font-family: monospace;
            color: var(--text);
            word-break: break-all;
        }
        .helper-box {
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            text-align: center;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Rolarr</h1>
                <p class="subtitle">Rolling Window Monitor Bridge</p>
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span style="color: {{ status_color }}">{{ status_text }}</span>
                </div>
            </div>
            
            <div class="info-section">
                <div class="info-group">
                    <div class="label">Sonarr URL</div>
                    <div class="value">{{ sonarr_url }}</div>
                </div>
                
                <div class="info-group">
                    <div class="label">Sonarr API Key</div>
                    <div class="value">{{ masked_key }}</div>
                </div>

                <div class="info-group">
                    <div class="label">Webhook Endpoint</div>
                    <div class="value">{{ webhook_url }}</div>
                </div>
            </div>

            <div class="helper-box">
                Configure Maintainerr notifications to send HTTP POST requests to the Webhook Endpoint.
            </div>
        </div>
    </div>
</body>
</html>
