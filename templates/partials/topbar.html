<!-- Topbar -->
<div class="topbar">
    <div class="brand">
        <span class="brand-name">Rolarr</span>
        <span class="brand-sub">Usenet Media Manager & Power Saver</span>
    </div>
    <div class="conn-pills">
        <span class="conn-pill" id="pill-nzbgeek" title="NZBgeek Indexer">
            <span class="conn-pip {{ 'ok' if nzbgeek_conn.ok else 'err' }}" id="pip-nzbgeek"></span>
            <span id="label-nzbgeek">NZBgeek</span>
        </span>
        <span class="conn-pill" id="pill-usenet" title="Usenet NNTP Downloader">
            <span class="conn-pip {{ 'ok' if usenet_conn.ok else 'err' }}" id="pip-usenet"></span>
            <span id="label-usenet">Usenet</span>
        </span>
        <a class="conn-pill" id="pill-plex" target="_blank" rel="noopener noreferrer" title="Open Plex">
            <span class="conn-pip {{ 'ok' if plex_conn_text == 'Connected' else ('warn' if 'Error' in plex_conn_text else 'err') }}" id="pip-plex"></span>
            <span id="label-plex">Plex</span>
        </a>
        <a class="conn-pill" id="pill-jellyfin" target="_blank" rel="noopener noreferrer" title="Open Jellyfin">
            <span class="conn-pip {{ 'ok' if jellyfin_conn_text == 'Connected' else ('warn' if 'Error' in jellyfin_conn_text else 'err') }}" id="pip-jellyfin"></span>
            <span id="label-jellyfin">Jellyfin</span>
        </a>
    </div>
</div>

<!-- Tab bar -->
<div class="tabbar">
    <button class="tab-btn active" id="tab-dashboard" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="tab-btn" id="tab-shows" onclick="switchTab('shows')">Shows</button>
    <button class="tab-btn" id="tab-movies" onclick="switchTab('movies')">Movies</button>
    <button class="tab-btn" id="tab-disks" onclick="switchTab('disks')">
        <span class="tab-label-desktop">Disk Space</span>
        <span class="tab-label-mobile">Disk</span>
    </button>
    <button class="tab-btn" id="tab-activity" onclick="switchTab('activity')">Activity</button>
    <button class="tab-btn" id="tab-config" onclick="switchTab('config')">Config</button>
</div>
