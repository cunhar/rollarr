<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rolarr{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Rolarr automated media recycler and power saver{% endblock %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        /* ── Reset ──────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Design tokens (shared across all pages) ────────────── */
        :root {
            color-scheme: dark;
            --bg:          #0c0c0e;
            --surface:     #111114;
            --surface-2:   #18181c;
            --border:      #242428;
            --border-hi:   #38383f;
            --text:        #e8e8ec;
            --text-sub:    #666672;
            --text-muted:  #3a3a42;
            --accent:      #5b6af0;
            --accent-dim:  rgba(91,106,240,.12);
            --green:       #3ecf8e;
            --amber:       #e5a00d;
            --red:         #e05252;
            --red-dim:     rgba(224,82,82,.12);
            --font:        'Inter', system-ui, sans-serif;
            --mono:        'JetBrains Mono', 'Fira Code', monospace;
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}

    {# ── Service Worker Registration (runs on every page) ────────────────── #}
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((reg) => console.log('[SW] Registered, scope:', reg.scope))
                .catch((err) => console.warn('[SW] Registration failed:', err));
        });
    }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
